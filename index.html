<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fluffy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --hue: 0deg; }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  @keyframes pulseGlow {
    0% { opacity: 0.3; transform: scale(0.95); }
    50% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66; }
    100% { opacity: 0.3; transform: scale(0.95); }
  }

  @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  @keyframes heartPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  html, body { width: 100%; overflow-x: hidden; }

  body {
    margin: 0; padding: 0 0 40px 0;
    font-family: 'Inter', sans-serif;
    background-color: #030305;
    color: #fff; min-height: 100vh;
    position: relative;
  }

  /* Arka Plan Videosu */
  #bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
    filter: hue-rotate(var(--hue)) saturate(1.3);
  }

  /* Noise Efekti */
  body::after {
    content: ""; position: fixed; inset: 0;
    background-image: url('https://www.transparenttextures.com/patterns/noise-lines.png');
    opacity: 0.05; pointer-events: none;
    z-index: 1;
  }

  body::before { content: ""; position: fixed; inset: 0; background: rgba(3, 3, 5, 0.45); z-index: -1; }

  /* ---------- Banner resmi kırpılmadan tam genişlikte ---------- */
  .banner-container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .banner-img {
    width: 100%;
    height: auto;
    display: block;
    filter: hue-rotate(var(--hue)) saturate(1.3);
  }

  .avatar-row {
    width: 100%;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 3;
  }

  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    border: 4px solid rgba(10, 10, 15, 0.9);
    margin-top: -48px; margin-bottom: 12px;
    object-fit: cover; background: #000;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    filter: hue-rotate(var(--hue)) saturate(1.3);
  }

  /* ---------- PC'de wrapper ve butonlar daha geniş ---------- */
  .wrapper {
    width: 100%; max-width: 560px; margin: 0 auto; padding: 0 20px;
    display: flex; flex-direction: column; align-items: center;
    position: relative; z-index: 2;
  }

  h1 { font-family: 'Inter', sans-serif; font-size: 2.2rem; margin: 0; text-transform: lowercase; letter-spacing: 1px; font-weight: 700; }

  .star-name { color: #00ff66; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; text-transform: lowercase; letter-spacing: 1px; }

  .typewriter-container { height: 24px; font-size: 0.95rem; font-weight: 500; color: rgba(255,255,255,0.8); }
  .cursor { display: inline-block; width: 2px; height: 14px; background-color: #fff; margin-left: 2px; animation: blinkCursor 0.8s infinite; }

  .links-stack { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; margin-top: 20px; }

  .link-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px; color: #fff; text-decoration: none; font-weight: 500; transition: 0.3s;
    cursor: pointer;
  }
  .link-btn::before {
    content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: 0.5s;
  }
  .link-btn:hover::before { left: 100%; }

  .link-left { display: flex; align-items: center; gap: 14px; }
  .link-left svg { width: 20px; height: 20px; fill: #fff; }

  .status-wrapper { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
  .pulse-dot { width: 8px; height: 8px; background-color: #00ff66; border-radius: 50%; animation: pulseGlow 2s infinite; }

  /* Müzik Çalar */
  .music-player {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .music-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .album-art { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; }
  .music-info { flex: 1; min-width: 0; }
  .song-title { font-size: 1rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist-name { font-size: 0.85rem; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .wave-icon { display: flex; align-items: flex-end; gap: 2px; height: 14px; opacity: 0.3; transition: 0.3s; }
  .wave-icon span { width: 3px; background: #fff; animation: waveAnim 1s infinite alternate; }
  .wave-icon span:nth-child(1) { height: 6px; animation-delay: 0.1s; }
  .wave-icon span:nth-child(2) { height: 14px; animation-delay: 0.3s; }
  .wave-icon span:nth-child(3) { height: 9px; animation-delay: 0.2s; }
  .wave-icon span:nth-child(4) { height: 12px; animation-delay: 0.4s; }
  @keyframes waveAnim { 0% { height: 4px; } 100% { height: 14px; } }

  .progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 0.75rem; color: rgba(255,255,255,0.6); }
  .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; position: relative; cursor: pointer; overflow: hidden; }
  .progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 3px; pointer-events: none; }

  .music-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
  .control-icon { width: 20px; height: 20px; fill: rgba(255,255,255,0.8); cursor: pointer; transition: 0.2s; }
  .control-icon:hover { fill: #fff; transform: scale(1.1); }

  .control-icon.liked {
    fill: #ff3366 !important;
    animation: heartPop 0.35s ease;
  }

  .play-pause-btn { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
  .play-pause-btn svg { width: 15px; height: 15px; fill: #000; }
  .play-pause-btn:hover { transform: scale(1.08); background: #fff; }

  .hue-box { width: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); }
  #hue-range { -webkit-appearance: none; width: 100%; height: 8px; background: linear-gradient(90deg, #ff0055, #ffff00, #00ff66, #00ffff, #0044ff, #cc00ff, #ff0055); border-radius: 10px; outline: none; }
  #hue-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #fff; border-radius: 50%; cursor: pointer; opacity: 0; transition: 0.3s; }
  #hue-range.active-thumb::-webkit-slider-thumb { opacity: 1; }
</style>
</head>
<body>

<video id="bg-video" autoplay loop muted playsinline preload="auto">
  <source src="bg-video.mp4" type="video/mp4">
</video>

<audio id="audio-player" src="audio.mp3" preload="auto" loop></audio>

<div class="banner-container">
  <img src="https://i.imgur.com/TWkbZ1s.jpeg" class="banner-img" alt="Banner">
</div>

<div class="avatar-row">
  <img src="https://i.imgur.com/nHae2l7.png" class="avatar" alt="avatar">
</div>

<div class="wrapper">
  <h1>fluffy</h1>
  <div class="star-name">zenittth☆</div>

  <div class="typewriter-container"><span id="typed-text"></span><span class="cursor"></span></div>

  <div class="links-stack">
    <a href="https://x.com/stor4m" target="_blank" class="link-btn">
      <div class="link-left"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span>Twitter / X</span></div>
      <span>↗</span>
    </a>

    <div class="link-btn" style="cursor: default;">
      <div class="link-left"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg><span>Discord: stor4m</span></div>
      <div class="status-wrapper"><div class="pulse-dot"></div><span>active</span></div>
    </div>
  </div>

  <div class="music-player">
    <div class="music-top">
      <img src="https://i.imgur.com/GOXZsqw.jpeg" class="album-art" alt="Loser Cover">
      <div class="music-info">
        <div class="song-title">Loser</div>
        <div class="artist-name">Tame Impala</div>
      </div>
      <div class="wave-icon" id="wave-anim">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="progress-container">
      <span class="time" id="current-time">0:00</span>
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="time" id="duration-time">0:00</span>
    </div>

    <div class="music-controls">
      <svg class="control-icon" id="like-btn" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <svg class="control-icon" id="prev-btn" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>

      <div class="play-pause-btn" id="play-pause-btn">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <svg class="control-icon" id="next-btn" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      <svg class="control-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
  </div>

  <div class="hue-box">
    <input id="hue-range" type="range" min="0" max="360" value="0">
  </div>
</div>

<script>
  const audio = document.getElementById('audio-player');
  const bgVideo = document.getElementById('bg-video');
  const playPauseBtn = document.getElementById('play-pause-btn');
  const playIcon = document.getElementById('play-icon');
  const progressBar = document.getElementById('progress-bar');
  const progressFill = document.getElementById('progress-fill');
  const currentTimeEl = document.getElementById('current-time');
  const durationEl = document.getElementById('duration-time');
  const waveAnim = document.getElementById('wave-anim');
  const likeBtn = document.getElementById('like-btn');

  likeBtn.addEventListener('click', () => {
    likeBtn.classList.toggle('liked');
  });

  function formatTime(seconds) {
    let mins = Math.floor(seconds / 60);
    let secs = Math.floor(seconds % 60);
    return mins + ":" + (secs < 10 ? "0" : "") + secs;
  }

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  window.addEventListener('DOMContentLoaded', () => {
    bgVideo.play().catch(e => console.log("Video otomatik oynatılamadı"));
    audio.play().then(() => {
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      waveAnim.style.opacity = "1";
    }).catch(error => {
      const unlockAudio = () => {
        audio.play();
        bgVideo.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        waveAnim.style.opacity = "1";
        window.removeEventListener('click', unlockAudio);
      };
      window.addEventListener('click', unlockAudio, { once: true });
    });
  });

  playPauseBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      waveAnim.style.opacity = "1";
    } else {
      audio.pause();
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      waveAnim.style.opacity = "0.3";
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    let progressPercent = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = progressPercent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;
    const duration = audio.duration;
    if (duration) {
      audio.currentTime = (clickX / width) * duration;
    }
  });

  document.getElementById('prev-btn').addEventListener('click', () => { audio.currentTime -= 10; });
  document.getElementById('next-btn').addEventListener('click', () => { audio.currentTime += 10; });

  const range = document.getElementById('hue-range');
  let hueValue = 0, isManual = false, resumeTimeout;

  setInterval(() => {
    if (!isManual) { hueValue = (hueValue + 1) % 360; document.documentElement.style.setProperty('--hue', hueValue + 'deg'); range.value = hueValue; }
  }, 50);

  function startInteraction() { isManual = true; range.classList.add('active-thumb'); clearTimeout(resumeTimeout); }
  function endInteraction() { clearTimeout(resumeTimeout); resumeTimeout = setTimeout(() => { isManual = false; range.classList.remove('active-thumb'); }, 1000); }

  range.addEventListener('mousedown', startInteraction); range.addEventListener('touchstart', startInteraction);
  range.addEventListener('mouseup', endInteraction); range.addEventListener('touchend', endInteraction);
  range.addEventListener('input', () => { hueValue = parseInt(range.value); document.documentElement.style.setProperty('--hue', hueValue + 'deg'); });

  const words = ["UI Designer", "Asset Creator", "Interface Specialist"];
  let i = 0;
  function typingEffect() {
    let word = words[i].split("");
    var loopTyping = function() {
      if (word.length > 0) { document.getElementById('typed-text').innerHTML += word.shift(); setTimeout(loopTyping, 100); }
      else { setTimeout(deletingEffect, 2000); }
    };
    loopTyping();
  }
  function deletingEffect() {
    let word = words[i].split("");
    var loopDeleting = function() {
      if (word.length > 0) { word.pop(); document.getElementById('typed-text').innerHTML = word.join(""); setTimeout(loopDeleting, 50); }
      else { i = (i + 1) % words.length; setTimeout(typingEffect, 500); }
    };
    loopDeleting();
  }
  typingEffect();
</script>

</body>
</html>
